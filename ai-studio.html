<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Capybara AI Studio</title>
<meta id="page-desc" name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="ai-studio">

<nav class="nav">
  <a href="index.html" aria-label="Capybara Creative" class="nav-logo"></a>
  <div class="nav-links mono">
    <a href="#servicios">SERVICIOS</a>
    <a href="#proceso">PROCESO</a>
    <a href="#resultados">RESULTADOS</a>
    <a href="#faq">FAQ</a>
  </div>
  <a href="#contacto" class="nav-cta mono">AGENDA UNA CONSULTA</a>
</nav>

<header class="ai-hero">
  <div id="a-eyebrow" class="eyebrow mono hero-anim"></div>
  <h1 id="a-title" class="hero-anim"></h1>
  <div class="ai-hero-foot hero-anim">
    <p id="a-subtitle"></p>
    <a id="a-hero-cta" href="#contacto" class="ai-hero-cta mono"></a>
  </div>
</header>

<section id="servicios">
  <span id="a-services-label" class="eyebrow mono" data-reveal></span>
  <h2 id="a-services-title" data-reveal style="margin:24px 0 48px;font-weight:900;text-transform:uppercase;font-size:clamp(32px,4vw,56px);letter-spacing:-0.02em;color:var(--ink)"></h2>
  <div id="a-services-grid" class="ai-services-grid" data-reveal></div>
</section>

<section id="proceso">
  <div class="section-head" data-reveal>
    <h2 id="a-process-title"></h2>
    <span id="a-process-label" class="mono" style="opacity:0.6"></span>
  </div>
  <div id="a-steps-grid" class="ai-steps-grid" data-reveal></div>
</section>

<section id="resultados">
  <span id="a-results-label" class="eyebrow mono" data-reveal></span>
  <h2 id="a-results-title" data-reveal style="margin:24px 0 48px;font-weight:900;text-transform:uppercase;font-size:clamp(32px,4vw,56px);letter-spacing:-0.02em;color:var(--ink)"></h2>
  <div id="a-cases-grid" class="ai-cases-grid" data-reveal></div>
</section>

<section id="faq" class="ai-faq-section">
  <div class="ai-faq-head" data-reveal>
    <span id="a-faq-label" class="eyebrow mono"></span>
    <h2 id="a-faq-title" style="margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(32px,4vw,56px);letter-spacing:-0.02em;color:var(--ink)"></h2>
  </div>
  <div id="a-faq-list" class="ai-faq-list" data-reveal></div>
</section>

<footer id="contacto">
  <div id="a-footer-label" class="footer-eyebrow mono"></div>
  <a id="a-footer-cta" href="mailto:hello@capybaracreative.xyz" class="footer-cta"></a>
  <p id="a-footer-subtext" class="ai-footer-subtext"></p>
  <div class="footer-bottom mono">
    <span id="a-footer-email"></span>
    <div class="socials">
      <a href="https://www.instagram.com/capybaracreative.xyz/">INSTAGRAM</a>
      <a href="index.html">CAPYBARACREATIVE.XYZ</a>
    </div>
    <span class="copyright">© 2026 CAPYBARA CREATIVE</span>
  </div>
</footer>

<script src="js/render-ai-studio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
