[build]
  publish = "."
  command = "node scripts/prerender.mjs"

# Old project.html?p=N links (from before each case study got its own URL)
# now get a real server-side 301 instead of a client-side JS redirect.
[[redirects]]
  from = "/project.html"
  query = { p = "1" }
  to = "/project-1.html"
  status = 301

[[redirects]]
  from = "/project.html"
  query = { p = "2" }
  to = "/project-2.html"
  status = 301

[[redirects]]
  from = "/project.html"
  query = { p = "3" }
  to = "/project-3.html"
  status = 301

[[redirects]]
  from = "/project.html"
  query = { p = "4" }
  to = "/project-4.html"
  status = 301

[[redirects]]
  from = "/project.html"
  to = "/project-1.html"
  status = 301

# Stale path from an earlier version of the site, kept as a safety net.
[[redirects]]
  from = "/uploads/logo.svg"
  to = "/assets/logo.svg"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
